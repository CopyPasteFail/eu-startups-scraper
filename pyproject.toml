[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "eu-startups-pipeline"
version = "0.1.0"
description = "Slow, resumable EU-Startups scraping and lead-enrichment pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "openpyxl>=3.1.5",
  "playwright>=1.55.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.8",
  "pyright==1.1.408",
  "bandit==1.9.4",
  "pip-audit==2.10.0",
  "deptry==0.25.1",
]

[project.scripts]
eu-startups-pipeline = "eu_startups_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_startups_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "scripts"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false
reportArgumentType = false
pythonVersion = "3.11"
