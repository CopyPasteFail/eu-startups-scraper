name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  security-and-deps:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and pinned dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Run Bandit
        run: python -m bandit -q -r src -s B404,B603,B607

      - name: Run pip-audit
        run: python -m pip_audit

      - name: Run deptry
        run: python -m deptry . --optional-dependencies-dev-groups dev
